[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pai"
version = "0.0.1"
description = "Hierarchical pixel-based active inference for a simulated Franka Panda"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "mujoco>=3.2",
    "pyyaml>=6",
    "imageio>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
chess = ["python-chess>=1.999,<2", "scikit-learn>=1.5,<2"]
# optional compiled chess inference (pai/chess/fast_rules.py); without it the NumPy reference runs
chess-fast = ["numba>=0.60"]
bike-video = ["imageio-ffmpeg>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["pai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the full simulator loop"]
