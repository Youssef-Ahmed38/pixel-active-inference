# Phase 0 defaults: MuJoCo Panda + PixelAI (2020-style) baseline.
seed: 0

env:
  image_size: 256
  control_dt: 0.02            # 50 Hz control; physics runs at the model timestep (0.002 s)
  max_joint_vel: 1.0          # rad/s clip on velocity actions
  # Joints the agent perceives/controls (0-based: joint1..joint7). The rest are held at home.
  # Joints 1, 2, 4, 6 are clearly observable from a single side camera; add the others once
  # the baseline works.
  active_joints: [0, 1, 3, 5]
  sample_half_range: [0.6, 0.5, 0.6, 0.6, 0.8, 0.5, 0.8]   # per joint, around the home pose
  camera:
    name: front
    pos: [1.2, -0.7, 0.9]
    target: [0.25, 0.0, 0.55]
    fovy: 52
  render:
    msaa: 0                   # 0 = off; multisampling costs ~2.5x render time
    shadow_size: 0            # 0 = no shadows
  disturbances: []

decoder:
  image_size: 128             # decoder output; observations are resized to this
  base_channels: 32
  max_channels: 512

data:
  dir: data/pixelai
  n_samples: 60000
  shard_size: 5000
  workers: 8

train:
  out_dir: runs/pixelai_decoder
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.0
  max_steps: 30000
  warmup_steps: 500
  val_fraction: 0.02
  log_every: 100
  eval_every: 2000
  ckpt_every: 1000
  num_workers: 2
  amp: auto                   # auto -> fp16 on T4 (no bf16), bf16 where supported, off on CPU

agent:
  goal_mode: image            # image (PixelAI) | joints (privileged attractor, for debugging)
  n_iters: 1                  # inference iterations per control step
  dt: 0.02                    # must match env.control_dt
  k_mu: 1.0                   # belief update gain
  k_a: 20.0                   # action gain
  pi_q: 1.0                   # proprioceptive precision
  pi_v: 1.0                   # visual precision (on the per-pixel mean squared error)
  # Belief dynamics mu'' = -K (mu' - beta (goal - mu)) with K = k_mu * pi_mu have damping ratio
  # sqrt(K / (4 beta)); keep pi_mu >= 4 beta or the belief itself oscillates.
  pi_mu: 40.0
  beta: 10.0                  # goal attractor strength (sweep: results/sweep_dist_beta*.json)
  action_mode: integral       # integral (PixelAI-style a_dot) | proportional
  action_damping: 6.0         # 1/s, damps the integrated action
  visual_action: true         # include the visual term in dF/da (PixelAI-style)

eval:
  episodes: 20
  steps: 300
  success_ee_dist: 0.02       # metres
  goal_scale: null            # null: goal sampled independently; s: goal = q0 + s * U(-half_range, half_range)
  min_goal_ee_dist: 0.05      # metres, reject start/goal pairs closer than this
  out_dir: results
  save_gif: true
