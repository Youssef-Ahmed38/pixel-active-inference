# HRM thinker on synthetic multi-cause inference (scripts/train_thinker_multicause.py).
# 0-3 simultaneous causes from a 6-cause library, overlapping effects -> explaining away.
seed: 0
out_dir: results/thinker

task:
  horizon: 64                 # up to 64 steps of prediction-error evidence (vs 32 in the single-cause task)
  min_length: 8
  max_active: 3                # 0..3 simultaneous causes
  onset_grid: [4, 20, 36, 52]   # per-cause nuisance grid, independent onset per active cause
  amplitude_grid: [0.7, 1.0, 1.3]  # shared nuisance
  noise_range: [0.3, 2.0]
  overlap: 0.6                 # higher than the single-cause default: signatures overlap more, so
                                # crediting one cause changes belief about the others (explaining away)

models: [hrm, transformer, mlp]
model:
  hrm: {d_model: 128, n_heads: 4, h_layers: 2, l_layers: 2, h_cycles: 2, l_steps: 2, max_segments: 8, patch: 2}
  transformer: {d_model: 128, n_heads: 4, n_layers: 4, patch: 2}
  mlp: {hidden: 512, n_layers: 4}

train:
  batch_size: 384
  steps: 3000
  baseline_steps: 4000
  lr: 1.0e-3
  warmup_steps: 300
  weight_decay: 0.1
  marginal_weight: 1.0         # BCE(per-cause marginal, true multi-hot) auxiliary
  subset_weight: 1.0           # KL(teacher subset posterior, predicted subset) -- the main target
  q_weight: 0.5
  ponder_cost: 0.01
  q_target: oracle
  amp: auto
  log_every: 250

eval:
  n: 6000
  batch: 2048
  n_bins: 5
  speed_batch: 2048
  overlaps: [0.0, 0.3, 0.6, 0.9]   # overlap sweep (eval-only, same trained model)
  overlap_n: 2000
