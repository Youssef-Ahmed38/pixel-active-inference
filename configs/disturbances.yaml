# Disturbance presets for scripts/run_eval.py --disturbance <name>.
# Control runs at 50 Hz, so step 50 = 1 s into the episode.
# The Menagerie position servos are very stiff: 40 N deflects the hand ~5 mm, 200 N ~40 mm,
# and above ~230 N the joint torque limits saturate and the arm collapses. Phase 1 adds a
# compliant (torque/impedance) mode where recovery is the agent's job, not the servo's.
push:
  - {type: push, start: 60, duration: 15, body: link5, force: [0, 200, 0]}
occlusion:
  - {type: occlusion, start: 30, duration: 90, box: [0.3, 0.25, 0.7, 0.6]}
lighting:
  - {type: lighting, start: 30, duration: -1, scale: 0.35, tint: [1.0, 0.85, 0.7]}
camera_shift:
  - {type: camera_shift, start: 30, duration: -1, offset: [0.0, 0.05, 0.03]}
payload:
  - {type: payload, start: 0, duration: -1, body: hand, mass: 2.0}
sensor_noise:
  - {type: sensor_noise, start: 0, duration: -1, q_std: 0.02, image_std: 8.0}
